<html>
<head>
  <meta charset="utf-8">
  <title>Roost Viewer</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #222; color: #eee; }
    #toolbar { margin-bottom: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #toolbar label { color: #aaa; font-size: 13px; }
    #toolbar select { padding: 3px 6px; }
    #stationSel { max-width: 160px; text-overflow: ellipsis; }
    #nav { margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    #nav button { padding: 4px 12px; }
    #frameInfo { display: inline-flex; flex-direction: column; align-items: center; min-width: 120px; font-variant-numeric: tabular-nums; }
    #frameTime { font-size: 12px; color: #999; }
    #viewerRow { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    #viewerWrap { position: relative; display: inline-block; border: 1px solid #555; --filtered-opacity: 0.35; }
    #viewerWrap .bbox.filtered { opacity: var(--filtered-opacity) !important; }
    #viewerWrap .bbox.filtered.selected { opacity: var(--filtered-opacity) !important; }
    #imageToggle { position: absolute; top: 6px; right: 6px; z-index: 10; display: flex; gap: 0; }
    #imageToggle button {
      padding: 2px 8px; font-size: 12px; cursor: pointer;
      border: 1px solid #888; background: rgba(0,0,0,0.5); color: #ccc;
    }
    #imageToggle button:first-child { border-radius: 3px 0 0 3px; }
    #imageToggle button:last-child { border-radius: 0 3px 3px 0; border-left: none; }
    #imageToggle button.active { background: rgba(255,255,255,0.25); color: #fff; }
    #optionsToggle { color: #aaa; cursor: pointer; font-size: 13px; user-select: none; }
    #optionsToggle:hover { color: #eee; }
    #optionsPanel { display: none; flex-shrink: 0; }
    #optionsPanel.open { display: flex; flex-direction: column; gap: 8px; }
    #optionsPanel .options-section { padding: 10px; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; font-size: 13px; }
    #optionsPanel ul { margin: 4px 0 0; padding-left: 18px; }
    #optionsPanel li { margin-bottom: 4px; }
    #optionsPanel input[type="number"] { width: 60px; padding: 2px 4px; }
    #optionsPanel input[type="range"] { vertical-align: middle; width: 80px; }
    #optionsPanel label { color: #aaa; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css">
</head>
<body>
  <h2>Roost Viewer</h2>
  <div id="toolbar">
    <label>Station <select id="stationSel"></select></label>
    <label>Year <select id="yearSel"></select></label>
    <label>Day <select id="daySel"></select></label>
    <span id="optionsToggle">&#9662; Options</span>
  </div>
  <div id="nav">
    <button id="prevBtn">&larr; Prev</button>
    <span id="frameInfo"><span id="frameCount">Scan -- / --</span><span id="frameTime"></span></span>
    <button id="nextBtn">Next &rarr;</button>
    <span style="color:#888; margin-left:10px;">&#8593;&#8595; days &#8194;&#8592;&#8594; scans</span>
  </div>
  <div id="viewerRow">
    <div id="viewerWrap">
      <div id="imageToggle">
        <button id="showDZ" class="active">DZ</button>
        <button id="showVR">VR</button>
        <button id="showMap" class="active" style="margin-left: 4px; border-radius: 3px;">Map</button>
      </div>
      <div id="viewer"></div>
    </div>
    <div id="optionsPanel">
      <div class="options-section">
        <strong>Track filtering</strong>
        <ul>
          <li>&ge; <input type="number" min="1" max="10" step="1" id="detections_min" value="2"> detections</li>
          <li>&ge; <input type="number" min="1" max="10" step="1" id="high_quality_detections_min" value="1"> detections with
            score &ge; <input type="number" min="-1" max="1" step="0.05" id="score_min" value="0.5"></li>
          <li>Avg score &ge; <input type="number" min="-1" max="1" step="0.05" id="avg_score_min" value="0.15"></li>
          <li>Filtered track opacity: <input type="range" min="0" max="1" step="0.05" id="filtered_opacity" value="0.35"> <span id="filtered_opacity_label">35%</span></li>
        </ul>
      </div>
      <div class="options-section">
        <strong>Display</strong>
        <ul>
          <li><label><input type="checkbox" id="utcToggle"> Show times in UTC</label></li>
        </ul>
      </div>
    </div>
  </div>
</body>
<script src="dist/viewer.min.js"></script>
</html>
