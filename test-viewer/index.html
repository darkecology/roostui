<html>
<head>
  <title>RoostViewer Test</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #111; color: #eee; }
    #controls { margin-bottom: 10px; }
    #controls button { margin-right: 8px; padding: 4px 12px; }
    #status { margin-bottom: 10px; }
    #status span { margin-right: 20px; }
    #viewer { margin-bottom: 10px; }
    #log {
      background: #222; padding: 8px; font-family: monospace; font-size: 12px;
      height: 120px; overflow-y: auto; border: 1px solid #444;
      max-width: 1200px;
    }
  </style>
</head>
<body>
  <h2>RoostViewer Test -- KCLE 8/20/2020</h2>
  <div id="controls">
    <button id="prevBtn">&larr; Prev</button>
    <button id="nextBtn">Next &rarr;</button>
    <button id="showDZ" disabled>DZ</button>
    <button id="showVR">VR</button>
    <span style="color:#888; margin-left:10px;">Arrow keys also work</span>
  </div>
  <div id="status">
    <span id="frameInfo">Frame -- / --</span>
    <span id="hoverInfo">Hover: --</span>
    <span id="selInfo">Selected: --</span>
  </div>
  <div id="viewer"></div>
  <h4>Event log</h4>
  <div id="log"></div>
</body>
<script src="dist/test-viewer.js"></script>
<!-- Build: rollup -c test-viewer/rollup.config.js (from project root) -->
</html>
