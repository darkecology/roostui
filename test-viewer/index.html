<html>
<head>
  <title>Roost Viewer</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #222; color: #eee; }
    #toolbar { margin-bottom: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #toolbar label { color: #aaa; font-size: 13px; }
    #toolbar select { padding: 3px 6px; }
    #nav { margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    #nav button { padding: 4px 12px; }
    #viewerRow { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    #viewerWrap { position: relative; display: inline-block; border: 1px solid #555; --filtered-opacity: 0; }
    #viewerWrap .bbox.filtered { opacity: var(--filtered-opacity) !important; }
    #viewerWrap .bbox.filtered.selected { opacity: var(--filtered-opacity) !important; }
    #imageToggle { position: absolute; top: 6px; right: 6px; z-index: 10; display: flex; gap: 0; }
    #imageToggle button {
      padding: 2px 8px; font-size: 12px; cursor: pointer;
      border: 1px solid #888; background: rgba(0,0,0,0.5); color: #ccc;
    }
    #imageToggle button:first-child { border-radius: 3px 0 0 3px; }
    #imageToggle button:last-child { border-radius: 0 3px 3px 0; border-left: none; }
    #imageToggle button.active { background: rgba(255,255,255,0.25); color: #fff; }
    #filterToggle { color: #aaa; cursor: pointer; font-size: 13px; user-select: none; }
    #filterToggle:hover { color: #eee; }
    #filterPanel { display: none; padding: 10px; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; font-size: 13px; flex-shrink: 0; }
    #filterPanel.open { display: block; }
    #filterPanel ul { margin: 4px 0 0; padding-left: 18px; }
    #filterPanel li { margin-bottom: 4px; }
    #filterPanel input[type="number"] { width: 50px; padding: 2px 4px; }
    #filterPanel input[type="range"] { vertical-align: middle; width: 80px; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css">
</head>
<body>
  <h2>Roost Viewer</h2>
  <div id="toolbar">
    <label>Station <select id="stationSel"></select></label>
    <label>Year <select id="yearSel"></select></label>
    <label>Day <select id="daySel"></select></label>
    <span id="filterToggle">&#9662; Filters</span>
  </div>
  <div id="nav">
    <button id="prevBtn">&larr; Prev</button>
    <span id="frameInfo">Frame -- / --</span>
    <button id="nextBtn">Next &rarr;</button>
    <span style="color:#888; margin-left:10px;">Arrow keys also work</span>
  </div>
  <div id="viewerRow">
    <div id="viewerWrap">
      <div id="imageToggle">
        <button id="showDZ" class="active">DZ</button>
        <button id="showVR">VR</button>
      </div>
      <div id="viewer"></div>
    </div>
    <div id="filterPanel">
      <strong>Track filtering</strong>
      <ul>
        <li>At least <input type="number" min="1" max="10" step="1" id="detections_min" value="2"> detections</li>
        <li>At least <input type="number" min="1" max="10" step="1" id="high_quality_detections_min" value="1"> detections with
          score at least <input type="number" min="-1" max="1" step="0.05" id="score_min" value="0.5"></li>
        <li>Average score at least <input type="number" min="-1" max="1" step="0.05" id="avg_score_min" value="0.15"></li>
        <li>Show filtered: <input type="range" min="0" max="1" step="0.05" id="filtered_opacity" value="0"> <span id="filtered_opacity_label">hidden</span></li>
      </ul>
    </div>
  </div>
</body>
<script src="dist/test-viewer.js"></script>
</html>
